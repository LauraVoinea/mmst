<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examples · mMST</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23002b36'/%3E%3Cpath d='M6 9h20M6 23h20' stroke='%2393a1a1' stroke-opacity='.6' stroke-width='1.5'/%3E%3Cpath d='M9 9l14 14' stroke='%232aa198' stroke-width='3'/%3E%3Cpath d='M9 23l14-14' stroke='%23b58900' stroke-width='3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
<script src="vendor/marked.umd.js"></script>
<script src="shared.js"></script>
<script src="examples.js"></script>
<style>
/* Protocols from /api/examples; descriptions from text/examples.md, read by examples.js. */
body{height:auto; min-height:100vh}
.doc .col{max-width:48rem}
.doc nav.jump{display:flex; flex-wrap:wrap; gap:.3rem 1.3rem; margin:-.5rem 0 .6rem; font-family:var(--mono); font-size:.74rem}
.doc p.intro{margin:-.1rem 0 1rem}
.doc .note{background:var(--card); border:1px solid var(--rule); border-left:3px solid var(--rhs); border-radius:0; padding:.8rem 1rem; margin:0 0 1.4rem}

/* featured: cards */
.ex{background:var(--card); border:1px solid var(--rule); border-radius:0; padding:1rem clamp(14px,2.4vw,20px) .8rem; margin:0 0 1rem; scroll-margin-top:1rem}
.ex-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:.2rem .8rem}
.ex-head h2{font-weight:700; font-size:1.1rem; line-height:1.2; margin:0; color:var(--ink)}
.from{font-family:var(--mono); font-size:.66rem; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.ex-head .go{margin-left:auto; display:flex; gap:.4rem}
.ex-head .go .btn{padding:.22rem .6rem; font-size:.72rem}
.ex ul.facts{list-style:none; margin:.55rem 0 .8rem; padding:0; display:flex; flex-wrap:wrap; gap:.35rem}
.ex ul.facts li{font-family:var(--mono); font-size:.7rem; color:var(--ink-2); background:var(--sunk); border:1px solid var(--rule); border-radius:0; padding:.06rem .55rem}
.doc .ex p{margin:0 0 .65rem}
.ex .lbl{font-family:var(--mono); font-size:.63rem; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); margin-right:.55rem}
.ex .try{border-top:1px dashed var(--rule-2); padding-top:.65rem; margin-top:.15rem}
.ex details{margin:0 0 .45rem}
.ex details summary{font-family:var(--mono); font-size:.72rem; color:var(--ink-3); cursor:pointer; list-style:none; width:max-content; max-width:100%}
.ex details summary::-webkit-details-marker{display:none}
.ex details summary::before{content:"\25B8\00a0"; color:var(--rhs)}
.ex details[open] summary::before{content:"\25BE\00a0"}
.ex details summary:hover{color:var(--ink)}
.doc .ex details p{margin:.45rem 0 .2rem}
.doc .ex details.src pre.code{margin:.5rem 0 .35rem; max-height:26rem; overflow:auto}

/* the rest: rows */
.doc ul.rows{list-style:none; margin:0 0 1.2rem; padding:0}
.doc ul.rows li{display:grid; grid-template-columns:12.5rem minmax(0,1fr) auto; gap:.15rem 1rem; align-items:baseline; padding:.6rem 0; border-bottom:1px solid var(--rule); scroll-margin-top:1rem}
.doc ul.rows .nm{display:flex; flex-direction:column; gap:.1rem; min-width:0}
.doc ul.rows .nm a{font-family:var(--mono); font-size:.84rem; overflow-wrap:anywhere}
.doc ul.rows .tx{color:var(--ink-2)}
.doc ul.rows a.efsm{font-family:var(--mono); font-size:.72rem; color:var(--ink-3)}
.doc ul.rows a.efsm:hover{color:var(--lhs)}
@media (max-width:640px){
  .doc ul.rows li{grid-template-columns:minmax(0,1fr) auto}
  .doc ul.rows a.efsm{grid-column:2; grid-row:1}
  .doc ul.rows .tx{grid-column:1 / -1; grid-row:2}
}
</style>
</head>
<body>

<header id="site-header"></header>

<main class="doc">
  <div class="col">

    <h1 class="title">Examples</h1>
    <p class="lede">What each protocol models, where its mixed choices are, and what to look at.</p>
    <nav class="jump" id="jump" aria-label="Sections"></nav>

    <div id="groups"><p>Loading&hellip;</p></div>

  </div>
</main>

<footer class="site" id="site-footer"></footer>

<script src="examples-page.js"></script>
</body>
</html>
